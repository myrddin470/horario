<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Control Horario Firebase</title>
<style>
/* ================== ESTILOS ================== */
body { font-family:"Segoe UI",sans-serif; background:#f0f2f5; margin:0; padding:0; }
header { text-align:center; padding:5px; background:#34495e; color:white; box-shadow:0 4px 8px rgba(0,0,0,0.2);}
.container { max-width:1200px; margin:20px auto; padding:15px; background:white; border-radius:12px; box-shadow:0 6px 15px rgba(0,0,0,0.2);}
.controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:15px; justify-content:center;}
select { padding:5px 10px; border-radius:8px; border:1px solid #ccc; font-size:16px;}
.info { display:flex; justify-content:space-around; flex-wrap:wrap; background:#ecf0f1; padding:10px; border-radius:10px; font-weight:bold; margin-bottom:15px;}
.calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
.weekday { text-align:center; font-weight:bold; background:#007bff; color:white; border-radius:8px; padding:6px 0;}
.day { aspect-ratio:1/1; background:#f9f9f9; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1); text-align:center; padding:8px; cursor:pointer; transition:0.12s; position:relative; display:flex; flex-direction:column; justify-content:space-between;}
.day:hover { transform:scale(1.03); box-shadow:0 4px 10px rgba(0,0,0,0.15);}
.day-number { font-weight:bold; font-size:1.1em;}
.note-indicator { position:absolute; bottom:6px; right:6px; font-size:14px;}
.vacaciones { background:#3498db; color:white; font-weight:bold;}
.permiso-horas { background:#ff69b4; color:white; font-weight:bold;}
.asuntos-propios { background:#27ae60; color:white; font-weight:bold;}
.otros { background:#95a5a6; color:white; font-weight:bold;}
.comision { background: #d2b48c; color: white; font-weight: bold;}
.domingo { background:#e74c3c; color:white; font-weight:bold;}
.festivo { background:#e74c3c; color:white; font-weight:bold;}
.day.hoy { border:2px solid #000; box-shadow:0 0 10px rgba(0,0,0,0.8);}
.modal, .modal-resumen { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); justify-content:center; align-items:center; z-index:999;}
.modal .content, .modal-resumen .content { background:white; padding:18px; border-radius:12px; width:92%; max-width:420px; box-shadow:0 8px 24px rgba(0,0,0,0.25);}
label { display:block; margin-top:6px;}
input[type="time"], textarea { width:100%; padding:6px; border-radius:6px; border:1px solid #ccc; margin-top:4px;}
.checkbox-row { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap;}
.btn-row { display:flex; gap:8px; justify-content:space-between; margin-top:12px;}
button { padding:8px 12px; border-radius:8px; border:none; font-weight:bold; cursor:pointer;}
.save { background:#27ae60; color:white;}
.cancel { background:#7f8c8d; color:white;}
.delete { background:#c0392b; color:white;}
.export, .import { background:#007bff; color:white;}
.legend { margin-top:12px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
.legend-item { display:flex; gap:8px; align-items:center; cursor:pointer; padding:6px 8px; border-radius:8px; transition:0.12s;}
.legend-item:hover { transform:scale(1.03); box-shadow:0 3px 8px rgba(0,0,0,0.12);}
.legend-color { width:18px; height:18px; border-radius:4px;}
.login-container { display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh;}
.login-container input { padding:8px; margin:6px 0; border-radius:6px; border:1px solid #ccc; width:200px;}
.login-container button { background:#007bff; color:white; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; font-weight:bold;}
</style>
</head>
<body>
<header><h1>Control Horario Inspección de transportes</h1></header>

<div id="loginScreen" class="login-container">
  <h2>Inicia sesión</h2>
  <input type="email" id="email" placeholder="Correo electrónico">
  <input type="password" id="password" placeholder="Contraseña">
  <button id="loginBtn">Login</button>
  <p id="loginError" style="color:red;"></p>
</div>

<div id="app" style="display:none;">
  <div class="container">
    <div class="controls">
      <button id="btnPrevMes" type="button">◀</button>
      <label>Mes: <select id="monthSelect"></select></label>
      <label>Año: <select id="yearSelect"></select></label>
      <button id="btnNextMes" type="button">▶</button>
      <button class="export" id="exportBtn">Exportar Excel</button>
      <input type="file" id="importFile" style="display:none;">
      <button class="import" id="importBtn">Importar Excel</button>
    </div>
    <div class="info">
      <div>Horas mensuales: <span id="horasObjetivo">00:00</span></div>
      <div>Horas restantes/extras: <span id="horasRestantes">00:00</span></div>
      <button id="verHorasExtras" class="export" style="margin-left:10px;">Ver Horas Extras</button>
    </div>
    <div class="calendar" id="calendar"></div>
    <div class="legend" id="legend">
      <div class="legend-item" id="legCom"><div class="legend-color" style="background:#d2b48c"></div><span>Comisión</span></div>
      <div class="legend-item" id="legVac"><div class="legend-color" style="background:#3498db"></div><span>Vacaciones</span></div>
      <div class="legend-item" id="legPH"><div class="legend-color" style="background:#ff69b4"></div><span>Permiso horas</span></div>
      <div class="legend-item" id="legAP"><div class="legend-color" style="background:#27ae60"></div><span>Asuntos propios</span></div>
      <div class="legend-item" id="legOtros"><div class="legend-color" style="background:#95a5a6"></div><span>Otros</span></div>
      <div class="legend-item"><button class="export" id="verAnualBtn" type="button">Permisos año</button></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
// ================== CONFIG FIREBASE ==================
const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_AUTH_DOMAIN",
  projectId: "TU_PROJECT_ID",
  storageBucket: "TU_STORAGE_BUCKET",
  messagingSenderId: "TU_MESSAGING_SENDER_ID",
  appId: "TU_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ================== LOGIN ==================
const loginScreen = document.getElementById('loginScreen');
const appDiv = document.getElementById('app');
const loginBtn = document.getElementById('loginBtn');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const loginError = document.getElementById('loginError');

loginBtn.onclick = () => {
  loginError.textContent = '';
  const email = emailInput.value;
  const password = passwordInput.value;
  auth.signInWithEmailAndPassword(email,password)
    .then(()=>{ loginScreen.style.display='none'; appDiv.style.display='block'; loadData(); })
    .catch(err=>loginError.textContent = err.message);
};

auth.onAuthStateChanged(user=>{
  if(user){
    loginScreen.style.display='none';
    appDiv.style.display='block';
    loadData();
  }else{
    loginScreen.style.display='flex';
    appDiv.style.display='none';
  }
});

// ================== VARIABLES ==================
const monthSelect=document.getElementById('monthSelect');
const yearSelect=document.getElementById('yearSelect');
const calendar=document.getElementById('calendar');
const horasObjetivoEl=document.getElementById('horasObjetivo');
const horasRestantesEl=document.getElementById('horasRestantes');
const exportBtn=document.getElementById('exportBtn');
const importBtn=document.getElementById('importBtn');
const importFile=document.getElementById('importFile');

let data={}; // datos cargados de Firebase
let currentMonth,currentYear,selectedKey;
const userRef = () => db.collection('users').doc(auth.currentUser.uid);

// ================== UTILIDADES ==================
function formatHHMM(minutes){ 
  const h=Math.floor(minutes/60); 
  const m=minutes%60; 
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; 
}

// ================== INICIALIZACIÓN ==================
function init(){
  const now=new Date();
  currentMonth=now.getMonth();
  currentYear=now.getFullYear();
  for(let m=0;m<12;m++){
    const opt=document.createElement('option');
    opt.value=m; opt.text=new Date(0,m).toLocaleString('es-ES',{month:'long'});
    monthSelect.appendChild(opt);
  }
  for(let y=2020;y<=2035;y++){
    const opt=document.createElement('option'); opt.value=y; opt.text=y; yearSelect.appendChild(opt);
  }
  monthSelect.value=currentMonth; yearSelect.value=currentYear;
  renderCalendar();
}

// ================== CARGA DATOS ==================
function loadData(){
  userRef().collection('controlHorario').get().then(snapshot=>{
    snapshot.forEach(doc=>{
      data[doc.id]=doc.data();
    });
    init();
  });
}

// ================== GUARDAR DÍA ==================
function saveDay(key, info){
  data[key] = info;
  userRef().collection('controlHorario').doc(key).set(info);
}

// ================== RENDER CALENDARIO ==================
function renderCalendar(){
  calendar.innerHTML='';
  const days=['L','M','X','J','V','S','D'];
  days.forEach(d=>{
    const el=document.createElement('div'); el.className='weekday'; el.textContent=d; calendar.appendChild(el);
  });

  const first=(new Date(currentYear,currentMonth,1).getDay()+6)%7;
  for(let i=0;i<first;i++) calendar.appendChild(document.createElement('div'));

  const dim=new Date(currentYear,currentMonth+1,0).getDate();
  for(let d=1;d<=dim;d++){
    const key=`${currentYear}-${currentMonth+1}-${d}`;
    let info=data[key]||{};
    const wd=new Date(currentYear,currentMonth,d).getDay();
    if(info.laborable===undefined){ info.laborable = (wd !== 0 && wd !== 6);}
    const cell=document.createElement('div'); cell.className='day'; cell.innerHTML=`<div class="day-number">${d}</div>`;
    cell.onclick=()=>editDay(key);
    calendar.appendChild(cell);
  }
}

// ================== EDITAR DÍA ==================
function editDay(key){
  let info = data[key] || {};
  const e1 = prompt('Entrada mañana (HH:MM)', info.entrada1||'');
  const s1 = prompt('Salida mañana (HH:MM)', info.salida1||'');
  const e2 = prompt('Entrada tarde (HH:MM)', info.entrada2||'');
  const s2 = prompt('Salida tarde (HH:MM)', info.salida2||'');
  const vac = confirm('Vacaciones?');
  const ph = confirm('Permiso horas?');
  info = {entrada1:e1, salida1:s1, entrada2:e2, salida2:s2, vacaciones:vac, permisoHoras:ph};
  saveDay(key, info);
  renderCalendar();
}

// ================== EVENTOS ==================
monthSelect.onchange=()=>{currentMonth=parseInt(monthSelect.value); renderCalendar();};
yearSelect.onchange=()=>{currentYear=parseInt(yearSelect.value); renderCalendar();};
</script>
</body>
</html>
