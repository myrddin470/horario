<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Control Horario Jornada Partida HH:MM</title>
<style>
/* ========================== ESTILOS ========================== */
body { font-family:"Segoe UI",sans-serif; background:#f0f2f5; margin:0; padding:0; }
header { text-align:center; padding:5px; background:#34495e; color:white; box-shadow:0 4px 8px rgba(0,0,0,0.2);}
.container { max-width:1200px; margin:20px auto; padding:15px; background:white; border-radius:12px; box-shadow:0 6px 15px rgba(0,0,0,0.2);}
.controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:15px; justify-content:center;}
select { padding:5px 10px; border-radius:8px; border:1px solid #ccc; font-size:16px;}
.info { display:flex; justify-content:space-around; flex-wrap:wrap; background:#ecf0f1; padding:10px; border-radius:10px; font-weight:bold; margin-bottom:15px;}
.calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
.weekday { text-align:center; font-weight:bold; background:#007bff; color:white; border-radius:8px; padding:6px 0;}
.day { aspect-ratio:1/1; background:#f9f9f9; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1); text-align:center; padding:8px; cursor:pointer; transition:0.12s; position:relative; display:flex; flex-direction:column; justify-content:space-between;}
.day:hover { transform:scale(1.03); box-shadow:0 4px 10px rgba(0,0,0,0.15);}
.day-number { font-weight:bold; font-size:1.1em;}
.note-indicator { position:absolute; bottom:6px; right:6px; font-size:14px;}
.vacaciones { background:#3498db; color:white; font-weight:bold;}
.permiso-horas { background:#ff69b4; color:white; font-weight:bold;}
.asuntos-propios { background:#27ae60; color:white; font-weight:bold;}
.otros { background:#95a5a6; color:white; font-weight:bold;}
.comision { background:#d2b48c; color:white; font-weight:bold;}
.domingo { background:#e74c3c; color:white; font-weight:bold;}
.festivo { background:#e74c3c; color:white; font-weight:bold;}
.day.hoy { position: relative; border-radius: 8px; box-shadow: 0 0 10px rgba(12, 12, 12, 0.8), 0 0 20px rgba(10, 10, 10, 0.5), 0 0 30px rgba(3, 3, 3, 0.3); z-index: 2; border: 2px solid rgb(12, 12, 12);}
.modal, .modal-resumen, .modal-login { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); justify-content:center; align-items:center; z-index:999;}
.modal .content, .modal-resumen .content, .modal-login .content { background:white; padding:18px; border-radius:12px; width:92%; max-width:420px; box-shadow:0 8px 24px rgba(0,0,0,0.25);}
label { display:block; margin-top:6px;}
input[type="time"], input[type="text"], input[type="password"], textarea { width:100%; padding:6px; border-radius:6px; border:1px solid #ccc; margin-top:4px;}
.checkbox-row { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap;}
.btn-row { display:flex; gap:8px; justify-content:space-between; margin-top:12px;}
button { padding:8px 12px; border-radius:8px; border:none; font-weight:bold; cursor:pointer;}
.save { background:#27ae60; color:white;}
.cancel { background:#7f8c8d; color:white;}
.delete { background:#c0392b; color:white;}
.export, .import { background:#007bff; color:white;}
.legend { margin-top:12px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
.legend-item { display:flex; gap:8px; align-items:center; cursor:pointer; padding:6px 8px; border-radius:8px; transition:0.12s;}
.legend-item:hover { transform:scale(1.03); box-shadow:0 3px 8px rgba(0,0,0,0.12);}
.legend-color { width:18px; height:18px; border-radius:4px;}
table { width:100%; border-collapse:collapse; margin-top:10px;}
th,td { border:1px solid #ddd; padding:6px; text-align:center; font-size:0.95em;}
th { background:#007bff; color:white;}
tfoot td { font-weight:bold; background:#f2f2f2;}
@media(max-width:700px){ .calendar { grid-template-columns:repeat(3,1fr);} }
</style>
</head>
<body>
<header><h1>Control Horario Inspección de transportes</h1></header>

<!-- LOGIN FIREBASE -->
<div class="modal-login" id="modalLogin">
  <div class="content">
    <h2>Iniciar Sesión</h2>
    <label>Correo: <input type="text" id="loginEmail"></label>
    <label>Contraseña: <input type="password" id="loginPassword"></label>
    <div class="btn-row">
      <button class="save" id="btnLogin">Login</button>
    </div>
    <p id="loginError" style="color:red;"></p>
  </div>
</div>

<div class="container" id="mainContainer" style="display:none;">
  <!-- Aquí va todo tu HTML original: controles, calendar, legend, modales... -->
  <!-- Para no repetir, este contenedor se mantiene oculto hasta que el usuario se loguee -->
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
// ====================== CONFIGURACIÓN FIREBASE ======================
const firebaseConfig = {
  apiKey: "AIzaSyA6_BtwhDpDkwPAEvL1QW8uKzBVj3m3cqI",
  authDomain: "controlhorario-cc874.firebaseapp.com",
  databaseURL: "https://controlhorario-cc874-default-rtdb.firebaseio.com",
  projectId: "controlhorario-cc874",
  storageBucket: "controlhorario-cc874.firebasestorage.app",
  messagingSenderId: "984659015045",
  appId: "1:984659015045:web:51a4124887121bd61ec0ec"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// ====================== LOGIN ======================
const modalLogin = document.getElementById("modalLogin");
const mainContainer = document.getElementById("mainContainer");
const btnLogin = document.getElementById("btnLogin");
const loginEmail = document.getElementById("loginEmail");
const loginPassword = document.getElementById("loginPassword");
const loginError = document.getElementById("loginError");

modalLogin.style.display = 'flex';

btnLogin.onclick = () => {
  const email = loginEmail.value.trim();
  const password = loginPassword.value.trim();
  loginError.textContent = "";
  if(!email || !password){ loginError.textContent="Introduce correo y contraseña"; return; }

  auth.signInWithEmailAndPassword(email,password)
    .then(userCredential=>{
      modalLogin.style.display='none';
      mainContainer.style.display='block';
      startApp();
    })
    .catch(err=>{
      loginError.textContent = err.message;
    });
};

// ====================== LÓGICA DE LA APP ======================
function startApp(){
  // Aquí va TODO tu código original dentro de startApp:
  // - Variables de calendario, modal, botones
  // - Funciones init, renderCalendar, openModalForDay, btnSave, btnDelete, etc.
  // - Exportar/Importar
  // - Vista anual
  // Solo reemplaza `localStorage` por `Firebase Realtime Database` si quieres sincronizar
  // Pero puedes mantener localStorage si quieres compatibilidad offline
  init(); // Inicializa el calendario
}
</script>
</body>
</html>
